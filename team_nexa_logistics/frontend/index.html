<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEAM NEXA | Logistics Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#071a2f;--blue:#146ef5;--cyan:#18b8d8;--ink:#142235;--muted:#6d7d90;--line:#e6edf4;--bg:#f5f8fc;--card:#fff;--green:#16a36a;--orange:#f59e0b;--red:#e5484d;--shadow:0 16px 40px rgba(9,31,56,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}
.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr;background:#071a2f}
.login-hero{padding:70px;position:relative;overflow:hidden;color:#fff;background:radial-gradient(circle at 20% 20%,#174c87,transparent 40%),linear-gradient(135deg,#06172b,#0a2745)}
.login-hero:after{content:"";position:absolute;width:500px;height:500px;border:1px solid rgba(255,255,255,.1);border-radius:50%;right:-220px;bottom:-230px;box-shadow:0 0 0 80px rgba(255,255,255,.025),0 0 0 160px rgba(255,255,255,.02)}
.brand{display:flex;align-items:center;gap:12px;font-family:"Plus Jakarta Sans";font-weight:800;font-size:24px}.brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2bd1e8,#146ef5);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px rgba(20,110,245,.35)}
.login-hero h1{font:800 54px/1.08 "Plus Jakarta Sans";max-width:650px;margin:100px 0 20px}.login-hero p{font-size:17px;line-height:1.7;color:#b8c8d9;max-width:610px}.hero-pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.pill{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);padding:10px 14px;border-radius:999px;font-size:13px;color:#d9e6f2}
.login-panel{display:flex;align-items:center;justify-content:center;padding:40px;background:#f7faff}.login-card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:var(--shadow)}.login-card h2{font:800 28px "Plus Jakarta Sans";margin:0 0 8px}.sub{color:var(--muted);font-size:14px;line-height:1.6}.field{margin-top:18px}.field label{display:block;font-size:12px;font-weight:700;color:#536578;margin-bottom:8px}.field input,.field select{width:100%;border:1px solid #dce5ee;border-radius:12px;padding:13px 14px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:#73a9ff;box-shadow:0 0 0 4px #146ef514}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;transition:.2s}.btn-primary{background:#146ef5;color:#fff;width:100%;margin-top:22px}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px #146ef530}.demo{margin-top:18px;padding:13px;border-radius:12px;background:#f2f7ff;font-size:12px;color:#52677d}.login-switch{display:flex;gap:8px;margin-top:18px}.login-switch button{flex:1;border:1px solid var(--line);background:#fff;padding:9px;border-radius:10px;font-size:12px;cursor:pointer}.login-switch button.active{background:#edf4ff;border-color:#a9c8ff;color:#146ef5;font-weight:700}

.layout{display:flex;min-height:100vh}.sidebar{width:260px;background:#081b31;color:#fff;position:fixed;left:0;top:0;bottom:0;padding:22px 16px;z-index:10}.sidebar .brand{padding:8px 10px 26px}.role-box{margin:0 8px 22px;padding:14px;border:1px solid rgba(255,255,255,.08);background:#ffffff08;border-radius:14px}.role-box small{color:#8fa6bd}.role-box strong{display:block;margin-top:4px;font-size:13px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aebfd0;text-align:left;padding:12px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600}.nav button:hover,.nav button.active{background:#146ef5;color:#fff}.logout{position:absolute;bottom:22px;left:16px;right:16px;background:#ffffff0c;color:#d7e3ef;border:1px solid #ffffff14;padding:11px;border-radius:10px;cursor:pointer}.main{margin-left:260px;width:calc(100% - 260px)}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.topbar .title{font:800 20px "Plus Jakarta Sans"}.top-actions{display:flex;gap:10px;align-items:center}.icon-btn{border:1px solid var(--line);background:#fff;width:40px;height:40px;border-radius:11px;cursor:pointer}.avatar{width:40px;height:40px;border-radius:12px;background:#dceaff;color:#146ef5;display:grid;place-items:center;font-weight:800}.content{padding:30px 34px}.welcome{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.welcome h1{font:800 28px "Plus Jakarta Sans";margin:0 0 7px}.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 7px 20px rgba(12,37,64,.035)}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700}.stat-num{font:800 28px "Plus Jakarta Sans";margin-top:13px}.stat-note{font-size:11px;color:var(--green);margin-top:6px}.grid2{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 7px 20px rgba(12,37,64,.035)}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel-head h3{font:800 15px "Plus Jakarta Sans";margin:0}.link{color:#146ef5;font-size:12px;font-weight:700;cursor:pointer}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:#8090a1;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:11px;border-bottom:1px solid var(--line)}td{padding:13px 11px;border-bottom:1px solid #eef2f6;white-space:nowrap}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800}.available,.approved,.delivered{background:#e9f8f1;color:#087b4f}.reserved,.pending,.allocated{background:#fff6dd;color:#a26700}.transit{background:#eaf2ff;color:#185fc8}.maintenance,.rejected{background:#ffecee;color:#b3262d}.search{border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:210px}.actions{display:flex;gap:7px}.mini{padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:700;cursor:pointer}.mini.primary{background:#146ef5;color:#fff;border-color:#146ef5}.page{display:none}.page.active{display:block}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.form-grid .field{margin-top:0}.full{grid-column:1/-1}.route{display:flex;align-items:center;gap:12px}.route span{height:1px;background:#dfe7ef;flex:1}.timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:26px 1fr;gap:10px;position:relative;padding-bottom:20px}.dot{width:12px;height:12px;border-radius:50%;background:#146ef5;margin-top:4px;box-shadow:0 0 0 5px #eaf2ff}.event:not(:last-child):before{content:"";position:absolute;left:5px;top:16px;bottom:0;width:2px;background:#e8eef5}.event strong{font-size:12px}.event small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.branch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.branch{padding:17px;border:1px solid var(--line);border-radius:14px;background:#fff}.branch strong{font-size:14px}.branch .district{color:#146ef5;font-size:11px;font-weight:700;margin-top:4px}.progress{height:7px;background:#edf2f7;border-radius:9px;margin-top:14px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#146ef5,#18b8d8);border-radius:9px}.notice{padding:13px;border-radius:12px;background:#eef6ff;border-left:3px solid #146ef5;font-size:12px;line-height:1.5;margin-bottom:10px}.toast{position:fixed;right:24px;bottom:24px;background:#071a2f;color:#fff;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);font-size:12px;z-index:50}
@media(max-width:1000px){.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.branch-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.login{grid-template-columns:1fr}.login-hero{display:none}.sidebar{position:relative;width:100%;height:auto}.layout{display:block}.main{margin-left:0;width:100%}.nav{grid-template-columns:repeat(2,1fr)}.logout{position:relative;left:auto;right:auto;bottom:auto;margin-top:10px}.cards,.branch-grid,.form-grid{grid-template-columns:1fr}.topbar{padding:0 16px}.content{padding:20px 16px}}
</style>
<style>
.creator-credit{position:absolute;left:24px;right:24px;bottom:82px;padding:12px 13px;border:1px solid #ffffff18;border-radius:12px;background:linear-gradient(135deg,#ffffff0d,#18b8d814);color:#dbeaf5}.creator-credit small{display:block;margin-bottom:4px;color:#7edfea;font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}.creator-credit strong{display:block;font-size:12px}.creator-credit span{display:block;margin-top:3px;color:#9fb5c7;font-size:10px;line-height:1.45}.login-credit{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);color:#718397;font-size:10px;line-height:1.55}.login-credit strong{color:#21364d;font-size:11px}.login-credit b{color:#146ef5;font-weight:700}
.nav-count{float:right;min-width:20px;padding:2px 6px;border-radius:10px;background:#f59e0b;color:#081b31;text-align:center;font-size:10px}.unread{border-left:3px solid #146ef5;background:#edf4ff}.modal-backdrop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:#071a2f99}.modal{width:min(560px,100%);padding:24px;border-radius:18px;background:#fff;box-shadow:0 24px 70px #071a2f40}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.modal-actions .btn{border:1px solid var(--line);background:#fff}.modal-actions .btn-primary{background:#146ef5;color:#fff;border:0;width:auto;margin-top:0}
.layout{position:relative;isolation:isolate;background:radial-gradient(ellipse at 88% -8%,#9ceaf2 0,transparent 25%),radial-gradient(ellipse at 38% 112%,#cfe2ff 0,transparent 32%),linear-gradient(135deg,#eaf7fb 0%,#f5f9ff 42%,#e6f2fb 100%)}.layout:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.42;background-image:linear-gradient(118deg,transparent 0 47%,#18b8d81c 47.2% 47.45%,transparent 47.65%),linear-gradient(28deg,transparent 0 62%,#146ef514 62.2% 62.45%,transparent 62.65%),linear-gradient(#ffffff80 1px,transparent 1px),linear-gradient(90deg,#ffffff80 1px,transparent 1px);background-size:100% 180px,100% 220px,34px 34px,34px 34px}.main{background:linear-gradient(180deg,#ffffff18,transparent 180px)}.topbar{position:sticky}.topbar:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,#146ef5,#18b8d8,#71f0c1);opacity:.8}.content{position:relative}.content:before{content:"";position:absolute;top:0;right:0;width:360px;height:260px;pointer-events:none;background:linear-gradient(135deg,transparent 45%,#18b8d81c 46%,#18b8d81c 48%,transparent 49%),linear-gradient(45deg,transparent 45%,#146ef516 46%,#146ef516 48%,transparent 49%);background-size:42px 42px}.panel,.stat{backdrop-filter:blur(8px);background:#ffffffed;box-shadow:0 14px 34px #0b416b12}.tracking-hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px;padding:28px;border-radius:20px;color:#fff;background:linear-gradient(120deg,#071a2f,#103d66 65%,#087e9d);box-shadow:0 18px 36px #071a2f1f}.tracking-hero h1{margin:8px 0 5px;font:800 30px "Plus Jakarta Sans"}.tracking-hero p{margin:0;color:#c6dce9;font-size:13px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#6ee6f1}.live-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:#ffffff18;color:#dffcff;font-size:11px;white-space:nowrap}.live-pill i{width:7px;height:7px;border-radius:50%;background:#71f0c1;box-shadow:0 0 0 4px #71f0c126;animation:pulse 1.7s infinite}.tracking-panel{position:relative;z-index:1}.tracking-line{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin:38px 8px 14px;position:relative}.tracking-line:before{content:"";position:absolute;top:16px;left:5%;right:5%;height:3px;background:#dce6ee}.tracking-stage{text-align:center;position:relative;z-index:1}.stage-dot{width:34px;height:34px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:#e5edf3;color:#8193a3;font-weight:800;font-size:12px;border:4px solid #fff;box-shadow:0 0 0 1px #d9e4ec}.tracking-stage.done .stage-dot{background:#18b8d8;color:#fff;box-shadow:0 0 0 1px #18b8d8,0 0 0 5px #18b8d81f}.tracking-stage.current .stage-dot{background:#146ef5;color:#fff;animation:pulse 1.7s infinite}.tracking-stage strong,.tracking-stage small,.tracking-stage em{display:block}.tracking-stage strong{font-size:11px}.tracking-stage small,.tracking-stage em{margin-top:5px;color:var(--muted);font-size:10px;font-style:normal}.tracking-stage em{color:#146ef5;font-weight:700}.activity{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.activity:last-child{border-bottom:0}.activity-dot{width:9px;height:9px;margin-top:4px;border-radius:50%;background:#18b8d8;box-shadow:0 0 0 4px #18b8d81a}.activity b,.activity small{display:block}.activity small{margin-top:4px;color:var(--muted);font-size:11px}.empty-state{text-align:center;padding:52px 20px}@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.75}}
@media(max-width:760px){.tracking-hero{display:block;padding:22px}.tracking-hero .live-pill{margin-top:18px}.tracking-line{grid-template-columns:1fr;gap:16px;margin:24px 0}.tracking-line:before{top:17px;bottom:17px;left:16px;right:auto;width:3px;height:auto}.tracking-stage{text-align:left;display:grid;grid-template-columns:34px 1fr;column-gap:12px;align-items:center}.tracking-stage .stage-dot{grid-row:span 3;margin:0}.tracking-stage strong,.tracking-stage small,.tracking-stage em{margin-top:0}}
@media(max-width:760px){.creator-credit{position:relative;left:auto;right:auto;bottom:auto;margin:18px 8px 0}.login-credit{font-size:9px}}
</style>

<body>
<div id="root"></div>
<script>
const state={user:null,page:"dashboard",containers:[],requests:[],branches:[],notifications:[],trackingId:null,trackingTimer:null};
const $=s=>document.querySelector(s);
const api=async(url,opt={})=>{const r=await fetch(url,{...opt,headers:{"Content-Type":"application/json","x-user-email":state.user?.email||"",...(opt.headers||{})}});if(!r.ok)throw new Error((await r.json()).message||"Request failed");return r.json()};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const badge=s=>`<span class="badge ${String(s).toLowerCase().replaceAll(" ","")}">${esc(s)}</span>`;
function login(){
document.body.innerHTML=`<div class="login">
<div class="login-hero"><div class="brand"><div class="brand-mark">N</div>TEAM NEXA</div>
<h1>One network.<br>One container view.</h1><p>Centralized container availability, allocation and tracking for TEAM NEXA branches across Tamil Nadu and interstate logistics operations.</p>
<div class="hero-pills"><span class="pill">Real-time availability</span><span class="pill">Branch-to-branch visibility</span><span class="pill">Digital approvals</span><span class="pill">Container tracking</span></div></div>
<div class="login-panel"><div class="login-card"><h2 id="loginTitle">Sign in to TEAM NEXA</h2><div class="sub" id="loginSub">Select your access portal and continue to the logistics command center.</div>
<div class="login-switch"><button class="active" onclick="setLogin('employee',this)">Employee</button><button onclick="setLogin('manager',this)">Branch Manager</button><button onclick="setLogin('owner',this)">Owner</button></div>
<form onsubmit="doLogin(event)" id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="employee@teamnexa.in"></div><div class="field"><label>Password</label><input id="password" type="password" required placeholder="••••••••"></div><div id="branchHint"></div><button class="btn btn-primary">Access Command Center →</button></form>
<div class="demo" id="demo">Demo employee: <b>employee@teamnexa.in</b> / <b>employee123</b></div><div class="login-credit"><strong>TEAM NEXA Logistics Platform</strong><br>Designed & developed by <b>AARI SANKAR K S</b><br>Student, Rathinam Technical Campus · 2nd Year · Reg. No. 25105004</div></div></div></div>`;
}
function setLogin(type,el){document.querySelectorAll(".login-switch button").forEach(b=>b.classList.remove("active"));el.classList.add("active");window.loginType=type;
const e=$("#email"),p=$("#password"),d=$("#demo"),h=$("#branchHint");h.innerHTML="";
if(type==="owner"){e.value="owner@teamnexa.in";p.value="owner123";d.innerHTML="Owner portal: <b>owner@teamnexa.in</b> / <b>owner123</b>";$("#loginTitle").textContent="Owner Control Center";}
else if(type==="manager"){e.value="coimbatore.manager@teamnexa.in";p.value="manager123";d.innerHTML="Example: <b>coimbatore.manager@teamnexa.in</b> / <b>manager123</b>";$("#loginTitle").textContent="Branch Manager Portal";h.innerHTML=`<div class="field"><label>District</label><select onchange="$('#email').value=this.value+'.manager@teamnexa.in'">${state.branches.map(b=>`<option value="${b.district.toLowerCase().replaceAll(" ","")}">${b.district}</option>`).join("")}</select></div>`}
else{e.value="employee@teamnexa.in";p.value="employee123";d.innerHTML="Common employee: <b>employee@teamnexa.in</b> / <b>employee123</b>";$("#loginTitle").textContent="Employee Portal";}
}
async function doLogin(ev){ev.preventDefault();try{const u=await api("/api/login",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#password").value})});state.user=u;await loadData();renderApp();toast("Welcome, "+u.name)}catch(e){alert(e.message)}}
async function loadData(){[state.branches,state.containers,state.requests,state.notifications]=await Promise.all([api("/api/branches"),api("/api/containers"),api("/api/requests"),api("/api/notifications")])}
function renderApp(){
document.body.innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-mark">N</div>TEAM NEXA</div>
<div class="role-box"><small>Signed in as</small><strong>${esc(state.user.name)}</strong><small>${esc(state.user.role==="manager"?state.user.branch||"Branch Manager":state.user.role==="owner"?"Network Owner":"Operations Employee")}</small></div>
<nav class="nav"><button data-page="dashboard">▦ &nbsp; Dashboard</button><button data-page="shipments">◈ &nbsp; Shipment Requests</button><button data-page="containers">▣ &nbsp; Container Inventory</button><button data-page="tracking">⌁ &nbsp; Tracking</button><button data-page="branches">⌂ &nbsp; Branch Network</button><button data-page="reports">◒ &nbsp; Reports & Analytics</button><button data-page="notifications">◉ &nbsp; Notifications ${state.notifications.filter(n=>!n.read).length?`<b class="nav-count">${state.notifications.filter(n=>!n.read).length}</b>`:""}</button></nav>
<div class="creator-credit"><small>Platform architect</small><strong>AARI SANKAR K S</strong><span>Rathinam Technical Campus · 2nd Year<br>Reg. No. 25105004</span></div><button class="logout" onclick="logout()">↪ &nbsp; Sign out</button></aside>
<main class="main"><header class="topbar"><div class="title" id="pageTitle">Dashboard</div><div class="top-actions"><button class="icon-btn">⌕</button><button class="icon-btn">♧</button><div class="avatar">${esc(state.user.name[0])}</div></div></header>
<section class="content">${pages()}</section></main></div>`;
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));go(state.page);
}
function pages(){return `<div id="dashboard" class="page"></div><div id="shipments" class="page"></div><div id="containers" class="page"></div><div id="tracking" class="page"></div><div id="branches" class="page"></div><div id="reports" class="page"></div><div id="notifications" class="page"></div>`}
function go(p){state.page=p;if(state.trackingTimer){clearInterval(state.trackingTimer);state.trackingTimer=null}document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$("#"+p).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));$("#pageTitle").textContent=p==="dashboard"?"Dashboard":p.replace(/^\w/,c=>c.toUpperCase()).replaceAll("-"," " );renderPage(p);if(p==="tracking")state.trackingTimer=setInterval(refreshTracking,5000)}
async function refreshTracking(){if(state.page!=="tracking")return;try{await loadData();tracking()}catch(error){toast("Tracking refresh failed")}}
function renderPage(p){if(p==="dashboard")dashboard();if(p==="shipments")shipments();if(p==="containers")containersPage();if(p==="tracking")tracking();if(p==="branches")branchesPage();if(p==="reports")reports();if(p==="notifications")notifications()}
function dashboard(){
const avail=state.containers.filter(c=>c.status==="Available").length, active=state.requests.filter(r=>["Pending","Approved","In Transit"].includes(r.status)).length;
$("#dashboard").innerHTML=`<div class="welcome"><div><h1>Good morning, ${esc(state.user.name.split(" ")[0])}.</h1><div class="muted">Here is today's network operations snapshot.</div></div><button class="btn" style="background:#146ef5;color:white" onclick="go('shipments')">＋ New Shipment Request</button></div>
<div class="cards"><div class="stat"><div class="stat-top">Available Containers <b>●</b></div><div class="stat-num">${avail}</div><div class="stat-note">Live network count</div></div><div class="stat"><div class="stat-top">Active Shipments <b>↗</b></div><div class="stat-num">${active}</div><div class="stat-note">Across current routes</div></div><div class="stat"><div class="stat-top">Branch Network <b>⌂</b></div><div class="stat-num">${state.branches.length}</div><div class="stat-note">Tamil Nadu branches</div></div><div class="stat"><div class="stat-top">Pending Approvals <b>!</b></div><div class="stat-num">${state.requests.filter(r=>r.status==="Pending").length}</div><div class="stat-note">Needs manager action</div></div></div>
<div class="grid2"><div class="panel"><div class="panel-head"><h3>Recent Shipment Requests</h3><span class="link" onclick="go('shipments')">View all →</span></div>${requestTable(state.requests.slice(0,5))}</div>
<div class="panel"><div class="panel-head"><h3>Network Alerts</h3></div><div class="notice"><b>Live visibility enabled</b><br>All branch inventory is synchronized through the central container database.</div><div class="notice"><b>Approval workflow</b><br>Pending allocations can be reviewed by authorized branch managers.</div><div class="notice"><b>Operations tip</b><br>Use container search before contacting another branch.</div></div></div>`;
}
function requestActions(id,showReview){let actions=`<button class="mini" onclick="viewRequest('${id}')">View</button>`;if(showReview)actions+=` <button class="mini primary" onclick="approvalModal('${id}')">Review</button>`;return actions}
function requestTable(rows){const manager=state.user?.role==="manager"||state.user?.role==="owner";return `<div class="table-wrap"><table><thead><tr><th>Request</th><th>Customer</th><th>Route</th><th>Container</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r.id}</b><br><small class="muted">${r.date} · ${r.requestedSize||""}</small></td><td>${esc(r.customer)}</td><td>${esc(r.origin)} → ${esc(r.destination)}</td><td>${esc(r.container)}</td><td>${badge(r.status)}</td><td>${requestActions(r.id,manager&&r.status==="Pending")}</td></tr>`).join("")}</tbody></table></div>`}
function shipments(){
$("#shipments").innerHTML=`<div class="panel"><div class="panel-head"><div><h3>Shipment & Allocation Requests</h3><div class="muted" style="margin-top:5px">Create, search and manage container allocation requirements.</div></div><button class="mini primary" onclick="newShipment()">＋ Create Request</button></div>${requestTable(state.requests)}</div>`;
}
function newShipment(){$("#shipments").innerHTML=`<div class="panel"><div class="panel-head"><h3>New Shipment Requirement</h3><span class="link" onclick="shipments()">← Back</span></div><form onsubmit="createShipment(event)"><div class="form-grid">
<div class="field"><label>Customer / Company</label><input name="customer" required placeholder="e.g. Arun Industries"></div><div class="field"><label>Required Shipment Date</label><input name="date" type="date" required></div>
<div class="field"><label>Origin</label><select name="origin">${state.branches.map(b=>`<option>${b.district}</option>`).join("")}</select></div><div class="field"><label>Destination State / City</label><input name="destination" required placeholder="e.g. Hyderabad, Telangana"></div>
<div class="field"><label>Cargo Type</label><input name="cargo" required placeholder="Industrial equipment"></div><div class="field"><label>Cargo Weight</label><input name="weight" required placeholder="8,000 kg"></div>
<div class="field"><label>Cargo Volume</label><input name="volume" required placeholder="28 m³"></div><div class="field"><label>Required Container Size</label><select name="containerSize"><option>20 ft</option><option>40 ft</option></select></div>
<div class="field full"><label>Operational Notes</label><input name="notes" placeholder="Special handling, delivery instructions, priority..."></div></div><button class="btn btn-primary" style="max-width:260px">Find & Submit Container Request →</button></form></div>`}
async function createShipment(ev){ev.preventDefault();const f=new FormData(ev.target),o=Object.fromEntries(f);try{await api("/api/requests",{method:"POST",body:JSON.stringify(o)});await loadData();toast("Shipment request created");shipments()}catch(error){toast(error.message)}}
function viewRequest(id){const r=state.requests.find(x=>x.id===id);alert(`${r.id}\n${r.customer}\n${r.origin} → ${r.destination}\n${r.cargo} | ${r.weight} | ${r.volume}\nContainer: ${r.container}\nStatus: ${r.status}\n\nTimeline:\n${(r.history||[]).map(x=>`${x.status} · ${new Date(x.at).toLocaleString()}`).join("\n")}`)}
function approvalModal(id){const r=state.requests.find(x=>x.id===id),branch=state.user.role==="manager"?state.user.branch:null;const available=state.containers.filter(c=>c.status==="Available"&&c.size===r.requestedSize&&(!branch||c.branch===branch));const modal=document.createElement("div");modal.className="modal-backdrop";modal.innerHTML=`<div class="modal"><div class="panel-head"><div><h3>Review ${r.id}</h3><div class="muted">${esc(r.origin)} → ${esc(r.destination)} · requires ${esc(r.requestedSize)}</div></div><button class="icon-btn" onclick="this.closest('.modal-backdrop').remove()">×</button></div><div class="field"><label>Suitable available container</label><select id="approvalContainer"><option value="">Select a container</option>${available.map(c=>`<option value="${c.id}">${c.id} · ${c.type} · ${c.branch}</option>`).join("")}</select></div><div class="modal-actions"><button class="btn" onclick="submitDecision('${id}','Rejected')">Reject request</button><button class="btn btn-primary" onclick="submitDecision('${id}','Approved')">Accept & Reserve</button></div>${available.length?`<div class="muted" style="margin-top:14px">${available.length} suitable containers available in ${branch||"the network"}.</div>`:`<div class="notice" style="margin-top:14px">No suitable available container exists in ${branch||"this branch"}.</div>`}</div>`;document.body.appendChild(modal)}
async function submitDecision(id,status){const container=$("#approvalContainer")?.value;if(status==="Approved"&&!container)return toast("Select a suitable container first");try{await api(`/api/requests/${id}`,{method:"PATCH",body:JSON.stringify({status,container})});await loadData();document.querySelector(".modal-backdrop")?.remove();renderApp();toast(`Request ${status.toLowerCase()}`)}catch(error){toast(error.message)}}
function containersPage(){
const canEdit=state.user.role!=="employee";$("#containers").innerHTML=`<div class="panel"><div class="panel-head"><div><h3>Central Container Inventory</h3><div class="muted" style="margin-top:5px">${state.containers.length} containers across ${state.branches.length} branches</div></div><input class="search" placeholder="Search container / branch..." oninput="filterContainers(this.value)"></div><div id="containerTable">${containerTable(state.containers,canEdit)}</div></div>`;
}
function containerTable(rows,canEdit){return `<div class="table-wrap"><table><thead><tr><th>Container ID</th><th>Type</th><th>Capacity</th><th>Branch contact</th><th>Status</th><th>Updated</th>${canEdit?"<th>Action</th>":""}</tr></thead><tbody>${rows.map(c=>{const b=state.branches.find(x=>x.name===c.branch);return `<tr><td><b>${c.id}</b></td><td>${c.type}</td><td>${c.size}<br><small class="muted">${c.maxWeight}</small></td><td><b>${esc(b?.name||c.branch)}</b><br><small class="muted">${esc(b?.district||"")} · ${esc(b?.mobile||"")}<br>${esc(b?.email||"")}</small></td><td>${badge(c.status)}</td><td>${c.updated}</td>${canEdit?`<td><button class="mini" onclick="cycleContainer('${c.id}')">Update</button></td>`:""}</tr>`}).join("")}</tbody></table></div>`}
function filterContainers(q){q=q.toLowerCase();const rows=state.containers.filter(c=>Object.values(c).join(" ").toLowerCase().includes(q));$("#containerTable").innerHTML=containerTable(rows,state.user.role!=="employee")}
async function cycleContainer(id){const c=state.containers.find(x=>x.id===id);const next={Available:"Reserved",Reserved:"Allocated",Allocated:"In Transit","In Transit":"Available",Maintenance:"Available"}[c.status]||"Available";try{await api("/api/containers/"+id,{method:"PATCH",body:JSON.stringify({status:next})});await loadData();containersPage();toast(`${id} updated to ${next}`)}catch(error){toast(error.message)}}
function tracking(){if(!state.requests.length){$("#tracking").innerHTML=`<div class="panel empty-state"><h3>No requests to track</h3><p class="muted">New employee requests will appear here automatically.</p></div>`;return}const r=state.requests.find(x=>x.id===state.trackingId)||state.requests[0];state.trackingId=r.id;const stages=["Pending","Approved","Reserved","Allocated","In Transit","Delivered","Completed"];const history=r.history||[];const eventFor=status=>history.find(event=>event.status===status)||history.find(event=>status==="Reserved"&&event.status==="Approved");$("#tracking").innerHTML=`<div class="tracking-hero"><div><span class="eyebrow">LIVE REQUEST CONTROL</span><h1>Shipment tracking</h1><p>Follow every milestone for each request as branch operations progress.</p></div><span class="live-pill"><i></i> Live · refreshes every 5 sec</span></div><div class="panel tracking-panel"><div class="panel-head"><div><h3>${esc(r.id)} · ${esc(r.customer)}</h3><div class="muted">${esc(r.origin)} → ${esc(r.destination)} · required ${esc(r.requestedSize||"container")}</div></div><select onchange="trackingRequest(this.value)">${state.requests.map(x=>`<option value="${x.id}" ${x.id===r.id?"selected":""}>${x.id} · ${x.customer}</option>`).join("")}</select></div><div class="tracking-line">${stages.map((stage,index)=>{const event=eventFor(stage),done=Boolean(event),current=!done&&index===history.length,branch=event?.branch||((stage==="Approved"||stage==="Reserved")?r.origin:"");return `<div class="tracking-stage ${done?"done":""} ${current?"current":""}"><div class="stage-dot">${done?"✓":index+1}</div><strong>${stage}</strong><small>${event?new Date(event.at).toLocaleString():current?"Awaiting update":"Pending"}</small>${branch?`<em>${esc(branch)} Branch${event?.by?` · ${esc(event.by)}`:""}</em>`:""}</div>`}).join("")}</div></div><div class="grid2"><div class="panel"><div class="panel-head"><h3>Current shipment</h3>${badge(r.status)}</div><div class="notice"><b>Container</b><br>${esc(r.container)}</div><div class="notice"><b>Route</b><br>${esc(r.origin)} → ${esc(r.destination)}</div></div><div class="panel"><div class="panel-head"><h3>Activity log</h3><span class="live-pill">${history.length} updates</span></div>${history.slice().reverse().map(event=>`<div class="activity"><span class="activity-dot"></span><div><b>${esc(event.status)}</b><small>${new Date(event.at).toLocaleString()}${event.branch?` · ${esc(event.branch)} Branch`:""}</small></div></div>`).join("")}</div></div>`}
function trackingRequest(id){state.trackingId=id;tracking()}
function branchesPage(){$("#branches").innerHTML=`<div class="panel"><div class="panel-head"><div><h3>TEAM NEXA Branch Network</h3><div class="muted" style="margin-top:5px">Centralized visibility across Tamil Nadu operations.</div></div><span class="link">${state.branches.length} active branches</span></div><div class="branch-grid">${state.branches.map(b=>{const cs=state.containers.filter(c=>c.branch===b.name),av=cs.filter(c=>c.status==="Available").length;return `<div class="branch"><strong>${b.name}</strong><div class="district">${b.district} District</div><div style="margin-top:13px;font-size:12px"><b>${cs.length}</b> containers · <b>${av}</b> available</div><div class="progress"><i style="width:${Math.max(8,Math.min(100,av*22))}%"></i></div><div class="muted" style="margin-top:9px">${b.email}</div></div>`}).join("")}</div></div>`}
function reports(){$("#reports").innerHTML=`<div class="cards"><div class="stat"><div class="stat-top">Container Utilization</div><div class="stat-num">78%</div><div class="stat-note">+6.4% vs previous month</div></div><div class="stat"><div class="stat-top">Avg. Allocation Time</div><div class="stat-num">14m</div><div class="stat-note">Target: under 20 minutes</div></div><div class="stat"><div class="stat-top">On-time Shipments</div><div class="stat-num">94%</div><div class="stat-note">Network performance</div></div><div class="stat"><div class="stat-top">Branch Response</div><div class="stat-num">11m</div><div class="stat-note">Average approval time</div></div></div><div class="grid2"><div class="panel"><div class="panel-head"><h3>Operational Performance</h3></div><div class="notice"><b>Centralized search</b><br>Manual branch-to-branch calls are replaced with a single availability search.</div><div class="notice"><b>Allocation workflow</b><br>Digital approval creates a traceable audit trail for each container.</div><div class="notice"><b>Network visibility</b><br>Owner and authorized managers can monitor branch-wise inventory in one place.</div></div><div class="panel"><div class="panel-head"><h3>Recommended KPIs</h3></div><ul style="font-size:12px;line-height:2.2;color:#536578"><li>Container utilization by branch</li><li>Average allocation turnaround time</li><li>Pending request aging</li><li>Inter-branch transfers</li><li>On-time dispatch and delivery</li><li>Maintenance downtime</li></ul></div></div>`}
function notificationClass(notification){return notification.read?"":"unread"}
function notificationRows(rows){return rows.map(n=>`<div class="notice ${notificationClass(n)}"><b>${esc(n.title)}</b><br>${esc(n.message)}<br><small class="muted">${new Date(n.createdAt).toLocaleString()}</small></div>`).join("")}
function notificationContent(){if(!state.notifications.length)return "<div class=\"notice\">No notifications yet.</div>";return notificationRows(state.notifications)}
function notifications(){$("#notifications").innerHTML=`<div class="panel"><div class="panel-head"><div><h3>Notifications & Alerts</h3><div class="muted">${state.notifications.filter(n=>!n.read).length} unread updates</div></div><button class="mini" onclick="markNotificationsRead()">Mark all read</button></div>${notificationContent()}</div>`}
async function markNotificationsRead(){try{await api("/api/notifications/read",{method:"PATCH"});await loadData();notifications();document.querySelector('[data-page="notifications"]')?.click()}catch(error){toast(error.message)}}
function logout(){state.user=null;state.page="dashboard";login()}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
(async()=>{try{state.branches=await api("/api/branches")}catch{}login()})();
</script>
</body>
</html>
